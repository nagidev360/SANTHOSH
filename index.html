<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANTHOSH BARCODE GEN</title><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#eef5ff}*{box-sizing:border-box}.top{padding:18px 24px;background:#0b1628;border-bottom:1px solid #263952;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}.brand b{color:#4f8cff}.wrap{max-width:1400px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:420px 1fr;gap:22px}.card{background:#101c2e;border:1px solid #263952;border-radius:16px;padding:20px}.field{margin:10px 0}.field label{display:block;color:#9db0ca;font-size:12px;margin-bottom:6px}input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #304866;background:#091525;color:#fff;border-radius:9px}input[type=color]{height:42px;padding:3px}button{border:0;border-radius:9px;padding:11px 14px;background:#4f8cff;color:#fff;font-weight:700;cursor:pointer;margin:4px 4px 0 0}.secondary{background:#263b59}.success{background:#16a36a}.danger{background:#c53b4a}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{position:relative;min-height:480px;background:#fff;color:#111;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.preview:after{content:var(--wm-content,"SANTHOSH");position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:rotate(-30deg);font-size:74px;font-weight:900;letter-spacing:10px;color:var(--wm-color,#000);opacity:var(--wm-opacity,.10);pointer-events:none}.preview>*{position:relative;z-index:2}.toolbar{display:flex;flex-wrap:wrap}.drop{border:2px dashed #36527a;padding:20px;text-align:center;border-radius:12px;color:#9db0ca}.status{margin-top:8px;color:#9db0ca;font-size:13px}.list{max-height:260px;overflow:auto}.item{padding:8px;border-bottom:1px solid #263952;display:flex;justify-content:space-between}.hidden{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><header class="top"><div class="brand">SANTHOSH <b>BARCODE GEN</b></div><div>Professional Barcode + QR</div></header><div class="wrap"><div class="grid"><section><div class="card"><h2>Barcode Settings</h2><div class="field"><label>Barcode Value</label><input id="value" value="123456789012"></div><div class="row"><div class="field"><label>Format</label><select id="format"><option>CODE128</option><option>CODE39</option><option>EAN13</option><option>EAN8</option><option>UPC</option><option>ITF14</option><option>MSI</option></select></div><div class="field"><label>Height</label><input id="height" type="number" min="20" max="400" value="100"></div></div><div class="row"><div class="field"><label>Barcode Color</label><input id="lineColor" type="color" value="#000000"></div><div class="field"><label>Background</label><input id="bgColor" type="color" value="#ffffff"></div></div><div class="field"><label>Product / Label Name</label><input id="labelText" placeholder="Product Name"></div><div class="card" style="padding:14px;margin-top:14px;background:#0b1729"><b>💧 SANTHOSH Watermark</b><div class="field"><label><input id="wmToggle" type="checkbox" checked style="width:auto"> Enable watermark</label></div><div class="field"><label>Watermark Name</label><input id="wmText" value="SANTHOSH"></div><div class="row"><div class="field"><label>Color</label><input id="wmColor" type="color" value="#000000"></div><div class="field"><label>Opacity</label><input id="wmOpacity" type="number" min="0" max="1" step="0.05" value="0.10"></div></div></div><div class="toolbar"><button id="generate">Generate</button><button class="success" id="save">💾 Save</button><button class="secondary" id="svg">Download SVG</button><button class="secondary" onclick="window.print()">🖨 Print</button></div></div><div class="card" style="margin-top:22px"><h2>📱 QR Generator</h2><div class="field"><label>QR Content</label><input id="qrText" placeholder="https://example.com"></div><button id="qrBtn">Generate QR</button></div><div class="card" style="margin-top:22px"><h2>📂 CSV / Excel Bulk</h2><div class="drop"><input id="file" type="file" accept=".csv,.xlsx,.xls"><p>CSV / Excel file upload</p></div><button class="success" id="importBtn">Import to Database</button><button class="secondary" id="template">CSV Template</button><div id="importStatus" class="status"></div></div></section><section><div class="card"><h2>Live Preview</h2><div class="preview" id="preview"><div id="productName"></div><svg id="barcode"></svg><div id="qr"></div></div></div><div class="card" style="margin-top:22px"><h2>💾 Saved Barcodes</h2><div class="toolbar"><button class="secondary" id="refresh">Refresh</button><span id="count" class="status"></span></div><div id="history" class="list"></div></div></section></div></div><script>const $=id=>document.getElementById(id);const api=async(url,opt={})=>{try{const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}catch(e){console.error(e);throw e}};function wm(){const p=$('preview');p.style.setProperty('--wm-content',JSON.stringify($('wmText').value||'SANTHOSH'));p.style.setProperty('--wm-color',$('wmColor').value);p.style.setProperty('--wm-opacity',$('wmToggle').checked?$('wmOpacity').value:0)}function generate(){const v=$('value').value.trim()||'123456';try{JsBarcode('#barcode',v,{format:$('format').value,height:+$('height').value||100,lineColor:$('lineColor').value,background:$('bgColor').value,displayValue:true,margin:10});$('productName').textContent=$('labelText').value;wm()}catch(e){alert('Invalid value for selected barcode format')}}function qr(){const box=$('qr');box.innerHTML='';new QRCode(box,{text:$('qrText').value||'SANTHOSH BARCODE GEN',width:180,height:180})}async function save(){try{await api('/api/barcodes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:$('value').value,format:$('format').value,label:$('labelText').value,settings:{height:$('height').value,lineColor:$('lineColor').value,bgColor:$('bgColor').value,watermark:$('wmText').value,opacity:$('wmOpacity').value}})});loadHistory();alert('Saved successfully')}catch(e){alert(e.message)}}async function loadHistory(){try{const d=await api('/api/barcodes');$('count').textContent=d.length+' saved';$('history').innerHTML=d.map(x=>`<div class=item><span><b>${escapeHtml(x.value)}</b> · ${escapeHtml(x.format)}<br><small>${escapeHtml(x.label||'')}</small></span><button class=danger onclick="removeItem(${x.id})">Delete</button></div>`).join('')||'<div class=status>No saved barcodes</div>'}catch(e){$('history').innerHTML='<div class=status>'+e.message+'</div>'}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function removeItem(id){try{await api('/api/barcodes/'+id,{method:'DELETE'});loadHistory()}catch(e){alert(e.message)}}async function importFile(){const f=$('file').files[0];if(!f)return alert('Select CSV or Excel file');const fd=new FormData();fd.append('file',f);$('importStatus').textContent='Importing...';try{const d=await api('/api/import',{method:'POST',body:fd});$('importStatus').textContent=`Imported ${d.count}; skipped ${d.skipped||0}`;loadHistory()}catch(e){$('importStatus').textContent='Error: '+e.message}}function downloadTemplate(){const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,barcode,name,format%0A123456789012,Product%20A,CODE128%0A987654321098,Product%20B,CODE128';a.download='santhosh-barcode-template.csv';a.click()}function downloadSVG(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('barcode').outerHTML],{type:'image/svg+xml'}));a.download='santhosh-barcode.svg';a.click()}$('generate').onclick=generate;$('save').onclick=save;$('qrBtn').onclick=qr;$('svg').onclick=downloadSVG;$('importBtn').onclick=importFile;$('template').onclick=downloadTemplate;$('refresh').onclick=loadHistory;['value','format','height','lineColor','bgColor','labelText','wmText','wmColor','wmOpacity','wmToggle'].forEach(id=>$(id).addEventListener('input',()=>{generate()}));window.addEventListener('error',e=>console.error('Frontend error',e.error||e.message));generate();loadHistory();</script></body></html>
